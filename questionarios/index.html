async function login(signup=false){
 const email=$('#email').value.trim(),password=$('#password').value;$('#authMsg').textContent='Processando...';
 const {data,error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
 if(error){$('#authMsg').innerHTML='<span class="err">'+esc(error.message)+'</span>';return}
 if(signup&&!data.session){$('#authMsg').innerHTML='<span class="oktxt">Cadastro criado. Confirme o e-mail, se solicitado, e depois entre.</span>';return}
 await boot();
}
async function boot(){
 const {data:{session:s}}=await db.auth.getSession();session=s;
 if(!session){$('#authBox').classList.remove('hidden');$('#app').classList.add('hidden');return}
 const email=session.user.email;
 const {data:admins}=await db.from('questionnaire_admins').select('email').ilike('email',email);isAdmin=!!admins?.length;
 const {data:access}=await db.from('questionnaire_access').select('*').ilike('email',email).eq('active',true);myAccess=access||[];
 $('#who').textContent=email+' - '+(isAdmin?'Administrador':(myAccess.map(x=>x.department).join(' | ')||'Aguardando liberação'));
 $('#authBox').classList.add('hidden');$('#app').classList.remove('hidden');
 $('#adminNav').classList.toggle('hidden',!isAdmin);
 const modules=[...new Set(myAccess.map(x=>x.module_code))];
 if(!isAdmin && modules.length===1){currentModule=modules[0];$('#moduleTabs').classList.add('hidden')}else{$('#moduleTabs').classList.remove('hidden')}
 document.querySelectorAll('#moduleTabs button').forEach(b=>b.classList.toggle('active',b.dataset.module===currentModule));
 await render();
}
function updateDeptOptions(){
 const m=$('#uModule')?.value||'educacao';if(!$('#uDept'))return;
 $('#uDept').innerHTML=DEPTS[m].map(x=>'<option>'+esc(x)+'</option>').join('');
}
async function getRows(){
 const {data:map,error}=await db.from('questionnaire_question_map').select('*').eq('module_code',currentModule).eq('active',true).order('sort_order');if(error)throw error;
 const visible=isAdmin?map:(map||[]).filter(q=>myAccess.some(a=>a.module_code===currentModule&&(a.department==='Todos'||a.department===q.responsible_area)));
 const ids=visible.map(x=>x.id);let answers=[];
 if(ids.length){const r=await db.from('questionnaire_answers_v2').select('*').in('question_id',ids);if(r.error)throw r.error;answers=r.data||[]}
 return {rows:visible,answers};
}
async function render(){
 $('#questionPanel').classList.toggle('hidden',isAdmin&&currentView==='users');
 $('#adminPanel').classList.toggle('hidden',!(isAdmin&&currentView==='users'));
 if(isAdmin&&currentView==='users'){await renderAdminPanel();return}
 $('#content').innerHTML='<div class="card">Carregando...</div>';
 try{
  const {rows,answers}=await getRows();
  const total=rows.length,done=answers.filter(x=>x.status==='Respondido').length,pct=total?Math.round(done*100/total):0;
  if(!rows.length){$('#content').innerHTML='<div class="card">'+(myAccess.length||isAdmin?'Não há perguntas desse módulo para o seu setor.':'Seu usuário ainda não foi vinculado a um setor. Solicite a liberação ao administrador.')+'</div>';return}
  $('#content').innerHTML='<div class="card"><strong>'+(currentModule==='educacao'?'Educação':'Segurança Alimentar e Nutricional')+'</strong><div class="progress" style="margin-top:10px"><span style="width:'+pct+'%"></span></div><div class="muted" style="margin-top:7px">'+done+' de '+total+' perguntas respondidas</div></div>'+rows.map(r=>card(r,answers.find(a=>a.question_id===r.id))).join('');
  bindQuestions();
 }catch(e){$('#content').innerHTML='<div class="card err">Erro ao carregar: '+esc(e.message||e)+'</div>'}
}
function card(row,ans){
 const def=Q[currentModule][row.question_ref]||{ref:row.question_ref,text:'Pergunta '+row.question_ref,fields:F.text()};
 const val=ans?.answer||{};
 return '<article class="card question" data-id="'+row.id+'" data-ref="'+esc(row.question_ref)+'"><div class="qhead"><div><h3>Questão '+esc(row.question_ref)+'</h3><div class="muted">'+esc(row.responsible_area)+'</div></div><span class="badge '+(ans?.status==='Respondido'?'ok':'warn')+'">'+esc(ans?.status||'Pendente')+'</span></div><div class="qtext">'+esc(def.text)+'</div><div class="fields">'+def.fields.map(f=>fieldHtml(f,val[f.key])).join('')+'</div><div class="field" style="margin-top:12px"><label>Observação ou fonte da informação (opcional)</label><textarea class="notes">'+esc(ans?.notes||'')+'</textarea></div><div class="actions"><button class="secondary saveDraft">Salvar</button><button class="saveDone">Salvar e marcar como respondida</button></div></article>';
}
function fieldHtml(f,v){
 if(f.type==='single')return '<div class="field" data-key="'+esc(f.key)+'" data-type="single"><label>'+esc(f.label)+'</label><div class="opts">'+f.options.map(o=>'<label class="opt"><input type="radio" name="q_'+Math.random().toString(36).slice(2)+'" value="'+esc(o)+'" '+(v===o?'checked':'')+'> '+esc(o)+'</label>').join('')+'</div></div>';
 if(f.type==='multi'){const a=Array.isArray(v)?v:[];return '<div class="field" data-key="'+esc(f.key)+'" data-type="multi"><label>'+esc(f.label)+'</label><div class="opts">'+f.options.map(o=>'<label class="opt"><input type="checkbox" value="'+esc(o)+'" '+(a.includes(o)?'checked':'')+'> '+esc(o)+'</label>').join('')+'</div></div>'}
 return '<div class="field" data-key="'+esc(f.key)+'" data-type="'+esc(f.type)+'"><label>'+esc(f.label)+'</label><input type="'+(f.type==='number'?'number':'text')+'" value="'+esc(v??'')+'" placeholder="'+esc(f.placeholder||'')+'"></div>';
}
function collect(card){
 const out={};card.querySelectorAll('.field[data-key]').forEach(el=>{const key=el.dataset.key,type=el.dataset.type;if(type==='single'){out[key]=el.querySelector('input:checked')?.value||''}else if(type==='multi'){out[key]=[...el.querySelectorAll('input:checked')].map(x=>x.value)}else{out[key]=el.querySelector('input')?.value||''}});return out;
}
function bindQuestions(){
 document.querySelectorAll('.saveDraft').forEach(b=>b.onclick=()=>saveQ(b,'Em preenchimento'));
 document.querySelectorAll('.saveDone').forEach(b=>b.onclick=()=>saveQ(b,'Respondido'));
}
async function saveQ(btn,status){
 const c=btn.closest('.question'),question_id=Number(c.dataset.id),answer=collect(c),notes=c.querySelector('.notes').value;
 const {error}=await db.from('questionnaire_answers_v2').upsert({question_id,answer,notes,status,answered_by:session.user.email,updated_at:new Date().toISOString()},{onConflict:'question_id'});
 if(error)return alert(error.message);await render();
}


function printableValue(field, value){
 if(Array.isArray(value)) return value.length ? value.join(', ') : '—';
 if(value===null || value===undefined || String(value).trim()==='') return '—';
 return String(value);
}

  '</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Salvar em PDF</button></div><div class="head"><h1>Questionário MUNIC 2026 - '+esc(moduleName)+'</h1><div class="meta">Município: Xinguara/PA<br>Gerado em: '+esc(generated)+'<br>Acesso: '+esc(respondent)+'</div></div><div class="summary"><strong>Resumo:</strong> '+done+' de '+rows.length+' perguntas respondidas.</div>'+questionHtml+'<div class="footer">Relatório gerado pelo Sistema de Questionários MUNIC 2026 - Xinguara/PA.</div></body></html>';

 updateDeptOptions();
 $('#uModule').onchange=updateDeptOptions;$('#addUserBtn').onclick=addUser;$('#resetPasswordBtn').onclick=adminResetPassword;
 document.querySelectorAll('.removeAccess').forEach(b=>b.onclick=async()=>{if(!confirm('Remover este acesso ao questionário?'))return;const {error}=await db.from('questionnaire_access').delete().eq('email',b.dataset.email).eq('module_code',b.dataset.module);if(error)return alert(error.message);await renderAdminPanel()});
}
async function adminResetPassword(){
 const email=$('#resetEmail').value.trim(),password=$('#resetPassword').value;
 if(!email||password.length<8){$('#resetMsg').innerHTML='<span class="err">Informe o e-mail e uma senha com pelo menos 8 caracteres.</span>';return}
 $('#resetMsg').textContent='Atualizando senha...';
 const {data,error}=await db.functions.invoke('questionnaire-admin-reset-password',{body:{email,password}});
 if(error){$('#resetMsg').innerHTML='<span class="err">'+esc(error.message||error)+'</span>';return}
 if(data?.error){$('#resetMsg').innerHTML='<span class="err">'+esc(data.error)+'</span>';return}
 $('#resetMsg').innerHTML='<span class="oktxt">Senha redefinida. O usuário já pode entrar com a nova senha.</span>';
 $('#resetPassword').value='';
}
async function addUser(){
 const payload={email:$('#uEmail').value.trim(),display_name:$('#uName').value.trim(),module_code:$('#uModule').value,department:$('#uDept').value,active:true};
 if(!payload.email)return $('#userMsg').innerHTML='<span class="err">Informe o e-mail.</span>';
 const {error}=await db.from('questionnaire_access').upsert(payload,{onConflict:'email,module_code'});
 if(error){$('#userMsg').innerHTML='<span class="err">'+esc(error.message)+'</span>';return}
 $('#userMsg').innerHTML='<span class="oktxt">Usuário/setor cadastrado. Quando essa pessoa entrar, irá direto para as perguntas correspondentes.</span>';
 setTimeout(()=>renderAdminPanel(),600);
}
$('#loginBtn').onclick=()=>login(false);$('#signupBtn').onclick=()=>login(true);$('#logoutBtn').onclick=async()=>{await db.auth.signOut();await boot()};$('#refreshBtn').onclick=render;$('#printReportBtn').onclick=printReport;
document.querySelectorAll('#moduleTabs button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('#moduleTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentModule=b.dataset.module;await render()});
document.querySelectorAll('#adminNav button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('#adminNav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;await render()});
boot();
</script>
</body></html>
